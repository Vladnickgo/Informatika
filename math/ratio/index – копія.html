<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Робочий зошит. Раціональні числа</title>
    <style>
        
    </style>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="35" viewBox="0 0 400 350" width="100%" height="100%">
  <!-- Фон (можна видалити, якщо потрібна прозорість) -->
  <rect width="400" height="350" fill="#F9F9F9" rx="15" />

  <!-- Основа лампи (сіра частина) -->
  <rect x="140" y="250" width="80" height="30" rx="5" fill="#D3D3D3" stroke="#000" stroke-width="8" />
  <rect x="150" y="280" width="60" height="35" rx="15" fill="#A9A9A9" stroke="#000" stroke-width="8" />

  <!-- Тіло лампи (жовта частина) -->
  <path d="M 180 70 A 90 90 0 0 1 270 160 C 270 210 230 250 220 250 L 140 250 C 130 250 90 210 90 160 A 90 90 0 0 1 180 70 Z" 
        fill="#F4C242" stroke="#000" stroke-width="8" stroke-linejoin="round" />

  <!-- Лінії-доріжки (ліва частина) -->
  <path d="M 100 120 L 70 120 L 50 90" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 90 160 L 60 160" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 100 200 L 70 200 L 50 230" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Кольорові крапки на кінцях доріжок -->
  <circle cx="40" cy="80" r="15" fill="#F4747C" stroke="#000" stroke-width="8" />
  <circle cx="40" cy="160" r="15" fill="#7CD4C9" stroke="#000" stroke-width="8" />
  <circle cx="40" cy="240" r="15" fill="#F4C242" stroke="#000" stroke-width="8" />

</svg>
</body>

</html>
