   <g id="text_1">
    <text style="font-weight: 700; font-size: 14.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: middle; fill: #1d1d1f" x="317.7" y="34.250406" transform="rotate(-0 317.7 34.250406)">Сегментація цільової аудиторії освітнього ресурсу</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: middle; fill: #86868b" x="317.7" y="53.988011" transform="rotate(-0 317.7 53.988011)">Адаптація інтерфейсу, навігації та контенту під потреби користувачів</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #ffffff" transform="translate(229.893906 86.22679)">ЦІЛЬОВА АУДИТОРІЯ (ЦА)</text>
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #ffffff" transform="translate(172.432539 100.188329)">Критерії: вік, цифрові навички, мета візиту</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: middle; fill: #0071e3" x="119.61" y="170.590019" transform="rotate(-0 119.61 170.590019)">Учні 1–4 класів</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(42.606 213.582786)">• Великі кнопки та іконки</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(42.606 227.481812)">• Мінімум суцільного тексту</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(42.606 241.380838)">• Ігрові елементи, аудіо</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(42.606 255.279864)">• Захист від реклами</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: middle; fill: #248a3d" x="317.7" y="170.590019" transform="rotate(-0 317.7 170.590019)">Батьки школярів</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(240.696 213.45219)">• Швидкий доступ зі смартфона</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(240.696 227.351216)">• Розклад, новини, оголошення</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(240.696 241.250243)">• Чіткі інструкції та контакти</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(240.696 255.41046)">• Прозорість та безпека даних</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: middle; fill: #6e30a8" x="515.79" y="170.590019" transform="rotate(-0 515.79 170.590019)">Педагоги та методисти</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(438.786 213.45219)">• Зручний пошук та фільтри</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(438.786 227.351216)">• Завантаження матеріалів</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(438.786 241.511434)">• Обмін досвідом на форумі</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(438.786 255.41046)">• Відповідність програмі НУШ</text>
