   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: middle; fill: #1d1d1f" x="317.7" y="34.343063" transform="rotate(-0 317.7 34.343063)">Анатомія HTML-сторінки (принцип матрьошки)</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #0071e3" x="49.86" y="74.279692" transform="rotate(-0 49.86 74.279692)">&lt;html&gt; ... &lt;/html&gt;  — кореневий контейнер усієї вебсторінки</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: middle; fill: #6e30a8" x="178.2" y="119.861156" transform="rotate(-0 178.2 119.861156)">&lt;head&gt; ... &lt;/head&gt;</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(76.46375 168.225855)">Службова інформація («паспорт»):</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(64.626719 181.797191)">• &lt;meta charset="UTF-8"&gt; — кирилиця</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(56.25125 195.368527)">• &lt;title&gt;Назва&lt;/title&gt; — текст на вкладці</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(86.735 208.939863)">• Підключення стилів та іконок</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(72.046562 222.764113)">(не відображається у вікні сторінки)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: middle; fill: #248a3d" x="457.2" y="119.808422" transform="rotate(-0 457.2 119.808422)">&lt;body&gt; ... &lt;/body&gt;</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(355.016016 168.005727)">Видима частина («вітрина» сайту):</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(340.231328 181.829977)">• Заголовки &lt;h1&gt;–&lt;h6&gt; та абзаци &lt;p&gt;</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(337.587031 195.654227)">• Зображення &lt;img&gt; та таблиці &lt;table&gt;</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(391.572969 209.225563)">• Гіперпосилання &lt;a&gt;</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(358.765469 222.796898)">• Відео &lt;video&gt; та аудіо &lt;audio&gt;</text>
   </g>
  </g>
