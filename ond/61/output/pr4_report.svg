   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: middle; fill: #1d1d1f" x="289.8" y="32.066869" transform="rotate(-0 289.8 32.066869)">Структура звіту про впровадження</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1d1d1f" x="97.848" y="80.526484" transform="rotate(-0 97.848 80.526484)">Опис розробки</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #86868b" x="97.848" y="92.479801" transform="rotate(-0 97.848 92.479801)">що впроваджується, звідки взято</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1d1d1f" x="97.848" y="128.436138" transform="rotate(-0 97.848 128.436138)">Адаптація</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #86868b" x="97.848" y="140.601721" transform="rotate(-0 97.848 140.601721)">як пристосовано до початкової школи</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1d1d1f" x="97.848" y="176.558058" transform="rotate(-0 97.848 176.558058)">Хід впровадження</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #86868b" x="97.848" y="188.723641" transform="rotate(-0 97.848 188.723641)">етапи, тривалість, учасники</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1d1d1f" x="97.848" y="224.657634" transform="rotate(-0 97.848 224.657634)">Результати й спостереження</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #86868b" x="97.848" y="236.845561" transform="rotate(-0 97.848 236.845561)">що змінилося, як реагували діти</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1d1d1f" x="97.848" y="272.893304" transform="rotate(-0 97.848 272.893304)">Висновки й рекомендації</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #86868b" x="97.848" y="284.967481" transform="rotate(-0 97.848 284.967481)">що варто поширити, що доопрацювати</text>
   </g>
