   <g id="text_3">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1d1d1f" x="35.91" y="97.565091" transform="rotate(-0 35.91 97.565091)">1. Педагогічне спостереження</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #515154" transform="translate(35.91 116.920025)">• Фіксація реальної поведінки учнів без втручання.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #515154" transform="translate(35.91 131.000644)">• Об'єкт: посадка за ПК, робота з мишею, взаємодопомога.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #515154" transform="translate(35.91 144.822728)">• Інструмент: карта спостереження з чіткими індикаторами.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1d1d1f" x="351.18" y="97.565091" transform="rotate(-0 351.18 97.565091)">2. Педагогічне тестування</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #515154" transform="translate(351.18 116.920025)">• Об'єктивна перевірка знань і алгоритмічних умінь.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #515154" transform="translate(351.18 131.000644)">• Формат: інтерактивні вправи, вибір 1 з 3–4 варіантів.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #515154" transform="translate(351.18 145.081263)">• Тривалість у 1–4 класах: не більше 7–10 хвилин.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1d1d1f" x="35.91" y="227.834325" transform="rotate(-0 35.91 227.834325)">3. Анкетування (опитування)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #515154" transform="translate(35.91 247.016681)">• Вивчення ставлення, інтересів та цифрових звичок.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #515154" transform="translate(35.91 260.838766)">• Для 1–2 класів: графічні шкали («смайлики», зірочки).</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #515154" transform="translate(35.91 274.919384)">• Прості, однозначні формулювання без подвійних заперечень.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1d1d1f" x="351.18" y="227.849091" transform="rotate(-0 351.18 227.849091)">4. Стандартизоване оцінювання</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #515154" transform="translate(351.18 247.016681)">• Оцінювання за єдиними критеріями та ключами для всіх.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #515154" transform="translate(351.18 261.0973)">• Переведення «сирих» балів у рівні сформованості.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #515154" transform="translate(351.18 275.177919)">• Забезпечує порівнюваність результатів різних класів.</text>
   </g>
  </g>
 </g>
