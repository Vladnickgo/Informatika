<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 640" width="820" height="640"><style>text { font-family: Arial, DejaVu Sans, sans-serif; }</style><rect width="820" height="640" fill="#FFFFFF"/><text x="410" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F3864">Структура підсумкового повідомлення студента</text><rect x="70" y="80" width="680" height="62" rx="10" fill="#DEEBF7" stroke="#4472C4" stroke-width="2.5"/><rect x="70" y="80" width="55" height="62" rx="10" fill="#4472C4"/><text x="97" y="119.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">1</text><text x="145" y="117.0" font-size="15" fill="#1F3864">Тема дослідження та актуальність</text><rect x="70" y="157" width="680" height="62" rx="10" fill="#E2EFDA" stroke="#70AD47" stroke-width="2.5"/><rect x="70" y="157" width="55" height="62" rx="10" fill="#70AD47"/><text x="97" y="196.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">2</text><text x="145" y="194.0" font-size="15" fill="#1F3864">Мета і завдання формувального етапу</text><rect x="70" y="234" width="680" height="62" rx="10" fill="#FFF2CC" stroke="#FFC000" stroke-width="2.5"/><rect x="70" y="234" width="55" height="62" rx="10" fill="#FFC000"/><text x="97" y="273.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">3</text><text x="145" y="271.0" font-size="15" fill="#1F3864">Зміст впливів (методи, форми, засоби)</text><rect x="70" y="311" width="680" height="62" rx="10" fill="#FCE4D6" stroke="#ED7D31" stroke-width="2.5"/><rect x="70" y="311" width="55" height="62" rx="10" fill="#ED7D31"/><text x="97" y="350.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">4</text><text x="145" y="348.0" font-size="15" fill="#1F3864">План упровадження (етапи й терміни)</text><rect x="70" y="388" width="680" height="62" rx="10" fill="#DEEBF7" stroke="#4472C4" stroke-width="2.5"/><rect x="70" y="388" width="55" height="62" rx="10" fill="#4472C4"/><text x="97" y="427.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">5</text><text x="145" y="425.0" font-size="15" fill="#1F3864">Критерії результативності та методи фіксації</text><rect x="70" y="465" width="680" height="62" rx="10" fill="#E2EFDA" stroke="#70AD47" stroke-width="2.5"/><rect x="70" y="465" width="55" height="62" rx="10" fill="#70AD47"/><text x="97" y="504.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">6</text><text x="145" y="502.0" font-size="15" fill="#1F3864">Очікувані результати та способи контролю</text><rect x="70" y="542" width="680" height="62" rx="10" fill="#FFF2CC" stroke="#FFC000" stroke-width="2.5"/><rect x="70" y="542" width="55" height="62" rx="10" fill="#FFC000"/><text x="97" y="581.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">7</text><text x="145" y="579.0" font-size="15" fill="#1F3864">Висновки + список джерел</text><text x="410" y="620" text-anchor="middle" font-size="12" font-style="italic" fill="#404040">Кожен блок — 2–3 речення; повідомлення = 1–1,5 сторінки</text></svg>