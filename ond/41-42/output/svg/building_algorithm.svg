<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 740" width="720" height="740"><style>text { font-family: Arial, DejaVu Sans, sans-serif; }</style><rect width="720" height="740" fill="#FFFFFF"/><text x="360" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F3864">Алгоритм побудови методики формувального етапу</text><rect x="80" y="70" width="560" height="82" rx="12" fill="#DEEBF7" stroke="#4472C4" stroke-width="2"/><circle cx="125" cy="111.0" r="23" fill="#4472C4"/><text x="125" y="118.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">1</text><text x="168" y="100" font-size="14" font-weight="bold" fill="#1F3864">Визначення мети і завдань</text><text x="168" y="126" font-size="12" fill="#404040">Чого хочемо досягти? Які зміни очікуємо?</text><line x1="360" y1="154" x2="360" y2="168" stroke="#1F3864" stroke-width="2"/><polygon points="354,168 360,178 366,168" fill="#1F3864"/><rect x="80" y="174" width="560" height="82" rx="12" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/><circle cx="125" cy="215.0" r="23" fill="#70AD47"/><text x="125" y="222.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">2</text><text x="168" y="204" font-size="14" font-weight="bold" fill="#1F3864">Вибір критеріїв і показників</text><text x="168" y="230" font-size="12" fill="#404040">За чим вимірюватимемо результат?</text><line x1="360" y1="258" x2="360" y2="272" stroke="#1F3864" stroke-width="2"/><polygon points="354,272 360,282 366,272" fill="#1F3864"/><rect x="80" y="278" width="560" height="82" rx="12" fill="#FFF2CC" stroke="#FFC000" stroke-width="2"/><circle cx="125" cy="319.0" r="23" fill="#FFC000"/><text x="125" y="326.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">3</text><text x="168" y="308" font-size="14" font-weight="bold" fill="#1F3864">Розробка змісту впливів</text><text x="168" y="334" font-size="12" fill="#404040">Які методи, форми, засоби впроваджуємо?</text><line x1="360" y1="362" x2="360" y2="376" stroke="#1F3864" stroke-width="2"/><polygon points="354,376 360,386 366,376" fill="#1F3864"/><rect x="80" y="382" width="560" height="82" rx="12" fill="#FCE4D6" stroke="#ED7D31" stroke-width="2"/><circle cx="125" cy="423.0" r="23" fill="#ED7D31"/><text x="125" y="430.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">4</text><text x="168" y="412" font-size="14" font-weight="bold" fill="#1F3864">Визначення етапів упровадження</text><text x="168" y="438" font-size="12" fill="#404040">Послідовність кроків реалізації методики</text><line x1="360" y1="466" x2="360" y2="480" stroke="#1F3864" stroke-width="2"/><polygon points="354,480 360,490 366,480" fill="#1F3864"/><rect x="80" y="486" width="560" height="82" rx="12" fill="#DEEBF7" stroke="#4472C4" stroke-width="2"/><circle cx="125" cy="527.0" r="23" fill="#4472C4"/><text x="125" y="534.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">5</text><text x="168" y="516" font-size="14" font-weight="bold" fill="#1F3864">Підбір методів фіксації результатів</text><text x="168" y="542" font-size="12" fill="#404040">Як збиратимемо й опрацьовуватимемо дані?</text><line x1="360" y1="570" x2="360" y2="584" stroke="#1F3864" stroke-width="2"/><polygon points="354,584 360,594 366,584" fill="#1F3864"/><rect x="80" y="590" width="560" height="82" rx="12" fill="#E2EFDA" stroke="#70AD47" stroke-width="2"/><circle cx="125" cy="631.0" r="23" fill="#70AD47"/><text x="125" y="638.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">6</text><text x="168" y="620" font-size="14" font-weight="bold" fill="#1F3864">Опис процедури контролю</text><text x="168" y="646" font-size="12" fill="#404040">Порівняння, аналіз, коригування, висновки</text></svg>