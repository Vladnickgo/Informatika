   <g id="text_1">
    <text style="font-weight: 700; font-size: 14.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: middle; fill: #1d1d1f" x="334.44" y="34.250406" transform="rotate(-0 334.44 34.250406)">Основні види діаграм для візуалізації педагогічних даних</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #0071e3" x="44.28" y="78.007744" transform="rotate(-0 44.28 78.007744)">КАТЕГОРІАЛЬНІ ДАНІ • ПОРІВНЯННЯ</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1d1d1f" x="44.28" y="99.902756" transform="rotate(-0 44.28 99.902756)">Стовпчаста діаграма (Bar / Column)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #424245" transform="translate(44.28 126.774705)">Порівнює величини між окремими групами:</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #424245" transform="translate(44.28 140.8481)">контрольним та експериментальним класами,</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #424245" transform="translate(44.28 154.921495)">рівнями досягнень НУШ (П, С, Д, В).</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #c93400" x="359.55" y="78.007744" transform="rotate(-0 359.55 78.007744)">НЕПЕРЕРВНІ ДАНІ • ЧАСТОТА ІНТЕРВАЛІВ</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1d1d1f" x="359.55" y="99.850022" transform="rotate(-0 359.55 99.850022)">Гістограма розподілу (Histogram)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #424245" transform="translate(359.55 126.643088)">Показує, скільки учнів потрапило у кожен</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #424245" transform="translate(359.55 140.716483)">числовий інтервал (наприклад, час виконання</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #424245" transform="translate(359.55 155.053113)">тесту або розподіл балів від 0 до 100).</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #248a3d" x="44.28" y="216.607744" transform="rotate(-0 44.28 216.607744)">ЧАСТКИ ЦІЛОГО • ВІДСОТКОВА СТРУКТУРА</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1d1d1f" x="44.28" y="238.450022" transform="rotate(-0 44.28 238.450022)">Кругова діаграма (Pie Chart)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #424245" transform="translate(44.28 265.338463)">Відображає внесок кожної категорії у 100%</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #424245" transform="translate(44.28 279.675093)">вибірки (наприклад, частки відповідей учнів</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #424245" transform="translate(44.28 293.748488)">в анкеті при кількості категорій до 5).</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #6e30a8" x="359.55" y="217.206572" transform="rotate(-0 359.55 217.206572)">ПАРНІ ЗМІННІ • КОРЕЛЯЦІЙНИЙ ЗВ'ЯЗОК</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1d1d1f" x="359.55" y="238.502756" transform="rotate(-0 359.55 238.502756)">Діаграма розсіювання (Scatter Plot)</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #424245" transform="translate(359.55 265.243088)">Виявляє залежність між двома показниками</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #424245" transform="translate(359.55 279.316483)">одного учня (наприклад, часом тренувань</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #424245" transform="translate(359.55 293.653113)">у Scratch та підсумковим балом за проєкт).</text>
   </g>
  </g>
 </g>
