   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #1d1d1f" transform="translate(61.308074 170.150381)">Створить ДВІ папки: «Моя» і «папка».</text>
