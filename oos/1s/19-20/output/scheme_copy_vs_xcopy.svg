   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: middle; fill: #1d1d1f" x="317.7" y="34.099669" transform="rotate(-0 317.7 34.099669)">copy та xcopy: у чому різниця</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: middle; fill: #ffffff" x="168.971538" y="118.125075" transform="rotate(-0 168.971538 118.125075)">copy</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: middle; fill: #0071e3" x="168.971538" y="156.106444" transform="rotate(-0 168.971538 156.106444)">Для ОДНОГО файлу</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1d1d1f" x="43.850769" y="194.108984" transform="rotate(-0 43.850769 194.108984)">•  Копіює файл або групу файлів за маскою</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1d1d1f" x="43.850769" y="220.441712" transform="rotate(-0 43.850769 220.441712)">•  НЕ копіює каталоги</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1d1d1f" x="43.850769" y="246.868112" transform="rotate(-0 43.850769 246.868112)">•  Синтаксис: copy &lt;звідки&gt; &lt;куди&gt;</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1d1d1f" x="43.850769" y="273.294512" transform="rotate(-0 43.850769 273.294512)">•  Приклад: copy звіт.txt D:\Архів</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: middle; fill: #ffffff" x="471.15" y="118.125075" transform="rotate(-0 471.15 118.125075)">xcopy</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: middle; fill: #248a3d" x="471.15" y="156.128787" transform="rotate(-0 471.15 156.128787)">Для КАТАЛОГІВ</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1d1d1f" x="346.029231" y="194.015312" transform="rotate(-0 346.029231 194.015312)">•  Копіює каталоги зі всім вмістом</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1d1d1f" x="346.029231" y="220.441712" transform="rotate(-0 346.029231 220.441712)">•  Параметр /S — з підкаталогами</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start; fill: #1d1d1f" x="346.029231" y="246.868112" transform="rotate(-0 346.029231 246.868112)">•  Параметр /E — і порожні каталоги</text>
   </g>
